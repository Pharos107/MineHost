[workspace]
resolver = "3"
members = ["crates/*"]
# `fuzz/` là workspace riêng của cargo-fuzz, không kéo libFuzzer vào `cargo test`.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Crate nội bộ. Chiều phụ thuộc được ghi trong AGENTS.md.
mh-core = { path = "crates/mh-core" }
mh-platform = { path = "crates/mh-platform" }
mh-store = { path = "crates/mh-store" }
mh-net = { path = "crates/mh-net" }
mh-java = { path = "crates/mh-java" }
mh-providers = { path = "crates/mh-providers" }
mh-runtime = { path = "crates/mh-runtime" }
mh-supervisor = { path = "crates/mh-supervisor" }
mh-backup = { path = "crates/mh-backup" }
mh-app = { path = "crates/mh-app" }
mh-api = { path = "crates/mh-api" }

# Thư viện bên ngoài.
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http-body-util = "0.1.5"
libc = "0.2.191"
md-5 = "0.11.0"
mime_guess = "2.0.5"
open = "5.4.5"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time", "io-util", "process"] }
tokio-tungstenite = "0.29.0"
tokio-util = "0.7.20"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.26.1", default-features = false }
ulid = "3.0.0"
utoipa = "6.0.0"
wiremock = "0.6.5"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# `legacy` / `arrays` / `zdict_builder` không cần để nén và giải nén mức 3.
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
