[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Crate nội bộ. Chiều phụ thuộc được ghi trong AGENTS.md.
mh-core = { path = "crates/mh-core" }
mh-platform = { path = "crates/mh-platform" }
mh-store = { path = "crates/mh-store" }
mh-net = { path = "crates/mh-net" }
mh-java = { path = "crates/mh-java" }
mh-providers = { path = "crates/mh-providers" }
mh-runtime = { path = "crates/mh-runtime" }
mh-supervisor = { path = "crates/mh-supervisor" }
mh-backup = { path = "crates/mh-backup" }
mh-app = { path = "crates/mh-app" }
mh-api = { path = "crates/mh-api" }

# Thư viện bên ngoài.
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
http-body-util = "0.1.5"
mime_guess = "2.0.5"
open = "5.4.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
