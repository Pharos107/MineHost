[package]
name = "minehost"
description = "MineHost: phần mềm host server Minecraft cho người không rành kỹ thuật."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "minehost"
path = "src/main.rs"

# Cùng mã nguồn với `fake-mc` của mh-runtime. Chỉ có khi build `--features e2e`,
# để test tích hợp lấy đường dẫn qua `CARGO_BIN_EXE_e2e-fake-mc`.
[[bin]]
name = "e2e-fake-mc"
path = "../mh-runtime/src/bin/fake-mc.rs"
required-features = ["e2e"]
test = false
doc = false

[features]
# Catalog và Java giả cho Playwright. Tắt ở bản phát hành.
e2e = ["mh-app/e2e"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
mh-api.workspace = true
mh-app.workspace = true
mh-core.workspace = true
mh-platform.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = { workspace = true }
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
