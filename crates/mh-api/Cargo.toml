[package]
name = "mh-api"
description = "REST và WebSocket của MineHost, kèm UI tĩnh được nhúng vào binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
futures-util.workspace = true
mh-app.workspace = true
mh-core.workspace = true
mime_guess.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
http-body-util.workspace = true
mh-platform.workspace = true
mh-supervisor.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
tower.workspace = true

# Cùng mã nguồn với `fake-mc` của mh-runtime; test WebSocket dùng nó thay cho Java.
[[bin]]
name = "api-fake-mc"
path = "../mh-runtime/src/bin/fake-mc.rs"
test = false
doc = false

[lints]
workspace = true
