[package]
name = "mh-app"
description = "Use case của MineHost. Là nơi duy nhất ghép các crate phía dưới lại với nhau."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
mh-backup.workspace = true
mh-core.workspace = true
mh-java.workspace = true
mh-net.workspace = true
mh-platform.workspace = true
mh-providers.workspace = true
mh-runtime.workspace = true
mh-store.workspace = true
mh-supervisor.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true

[features]
# Catalog Paper và Java giả. Tắt ở bản phát hành; `minehost` bật khi build test giao diện.
e2e = []

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Cùng mã nguồn với `fake-mc` của mh-runtime; test dùng nó thay cho Java.
[[bin]]
name = "app-fake-mc"
path = "../mh-runtime/src/bin/fake-mc.rs"
test = false
doc = false

[lints]
workspace = true
