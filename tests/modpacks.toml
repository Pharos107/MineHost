# Modpack cố định cho workflow `modpacks` (spec P3 mục 9.2, test `crates/minehost/tests/modpacks.rs`).
#
# Mỗi pack ghim một bản (`version_id`) để test không đỏ chỉ vì tác giả ra bản mới. Thêm hay đổi bản
# thì chạy thử riêng pack đó trước: workflow `modpacks` với input `packs=<id>`.
#
# Trường: `memory_mb` là heap tối đa (tối thiểu lấy min(4096, memory_mb)); `done_timeout_s` là thời
# gian chờ từ lúc bấm bật tới `Done`; `install_timeout_s` (mặc định 1800) cho Job cài; `note` ghi vì
# sao chọn pack, hiện trong báo cáo.
#
# Mỗi pack dưới đây đã chạy thử tới `Done` trên máy của runner (dangserver) ngày 2026-11-15 và 2026-11-16; dòng `# đo:`
# ghi số đo lần đó.

