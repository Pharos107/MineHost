# Cấu hình cargo-deny: lỗ hổng bảo mật, giấy phép, nguồn crate.
# Thêm giấy phép mới vào `allow` chỉ sau khi đã đọc điều khoản của nó.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

# Kho chứng chỉ gốc của Mozilla mà rustls dùng khi không đọc được kho của OS. CDLA-Permissive-2.0
# là giấy phép dữ liệu cho dùng và phân phối tự do; chỉ mở cho đúng crate này.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
