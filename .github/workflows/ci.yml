name: CI

# Tạm thời chỉ chạy tay (tab Actions → CI → Run workflow).
# Khi muốn bật lại tự động, thêm `push: { branches: [main] }` và `pull_request:`.
on:
  workflow_dispatch:
    inputs:
      integration:
        description: "Chạy cả test tích hợp với Paper thật (vài phút mỗi OS)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ui:
    name: UI (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  rust:
    name: Rust (${{ matrix.name }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Cài toolchain theo rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        if: matrix.name == 'linux-x64'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: build release
        run: cargo build --release --locked -p minehost

  e2e:
    name: E2E (Playwright, binary thật)
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Cài toolchain theo rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Chế độ e2e: catalog Paper giả và Java giả (fake-mc), không gọi mạng (crates/minehost/README.md).
      - name: Build minehost (e2e) và fake-mc
        run: |
          cargo build --locked -p mh-runtime --bin fake-mc
          cargo build --locked -p minehost --features e2e
      - name: Cài Playwright
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Chạy test E2E
        working-directory: ui
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  integration:
    name: Tích hợp Paper thật (${{ matrix.name }})
    if: inputs.integration
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      MINEHOST_E2E_DIR: ${{ github.workspace }}/.minehost-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Cài toolchain theo rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Java và file Paper tải về nằm trong java/ và cache/ của thư mục dữ liệu; khóa theo phiên
      # bản cố định trong test (Paper 1.21.4, Java 21) để lần sau không phải tải lại.
      - uses: actions/cache@v4
        with:
          path: |
            .minehost-e2e/java
            .minehost-e2e/cache
          key: e2e-${{ runner.os }}-paper-1.21.4-java-21-v1
      - name: Test tích hợp
        run: cargo test -p minehost --test paper --test loaders --locked -- --ignored --test-threads=1
        timeout-minutes: 60

  checks:
    name: Kiểm tra repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giới hạn độ dài file
        run: bash scripts/check-file-size.sh
      - name: Schema TypeScript khớp với OpenAPI
        run: |
          rustup toolchain install
          cargo run -q --locked -p minehost -- openapi > /tmp/openapi.json
          diff -u <(tr -d '\r' < ui/src/api/openapi.json) /tmp/openapi.json \
            || (echo "::error::Chạy 'npm run gen:api' trong ui/ rồi commit lại." && exit 1)

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
